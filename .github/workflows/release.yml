name: Release

# Run from the Actions tab (or push a v* tag) to publish the version in CMakeLists.txt as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Clip_Engine-${{ needs.build.outputs.version }}-windows-x64
          path: Clip_Engine

      - uses: actions/download-artifact@v4
        with:
          name: Clip_Engine-${{ needs.build.outputs.version }}-setup
          path: setup

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The installer and one zip, under names that never change, so .../releases/latest/download/Clip_Engine-Setup.exe
          # (the website's download button) and .../Clip_Engine-windows-x64.zip always get the newest version. The
          # release's tag says which version it is. The app's own updater uses the zip.
          # Screenshots stay in the build's artifacts, not on the release.
          zip -r Clip_Engine-windows-x64.zip Clip_Engine
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the version in CMakeLists.txt first." >&2
            exit 1
          fi
          gh release create "$tag" setup/Clip_Engine-Setup.exe Clip_Engine-windows-x64.zip \
            --target "$GITHUB_SHA" --title "Clip Engine $VERSION" --notes-file .github/release-notes.md

      # For a source repository kept private, whose releases players can't download. When the repository variable
      # DOWNLOADS_REPO (e.g. MochiBoy9/Clip_Engine-downloads, a public repository) and the secret DOWNLOADS_TOKEN (a
      # fine-grained token with Contents: read and write on that repository) are set, the zip is published there too.
      - name: Publish to the public downloads repository
        if: vars.DOWNLOADS_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ vars.DOWNLOADS_REPO }}
        run: |
          gh release create "v$VERSION" setup/Clip_Engine-Setup.exe Clip_Engine-windows-x64.zip --repo "$REPO" \
            --title "Clip Engine $VERSION" --notes-file .github/release-notes.md
