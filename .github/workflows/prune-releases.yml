name: Prune old releases

# Run from the Actions tab to delete every GitHub release older than a version (0.8.0 unless you type another).
# Only the release pages and their downloads go; the git tags stay, so the history is still there.
on:
  workflow_dispatch:
    inputs:
      below:
        description: Delete releases below this version
        default: '0.8.0'
        required: true
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
          BELOW: ${{ inputs.below }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! [[ "$BELOW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Type a version like 0.8.0." >&2
            exit 1
          fi
          older() { [ "$1" != "$BELOW" ] && [ "$(printf '%s\n%s\n' "$1" "$BELOW" | sort -V | head -n1)" = "$1" ]; }
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            version="${tag#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || continue
            if older "${BASH_REMATCH[0]}"; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "Would delete $tag"
              else
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
                echo "Deleted $tag"
              fi
            fi
          done
