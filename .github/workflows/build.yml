name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.windows.outputs.version }}

jobs:
  # The online service for squads and the cloud library (server/), run in Cloudflare's local runtime.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Test online service
        run: npm test

  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -nE 's/^project\(ClipEngine VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure engine
        run: cmake -S . -B build -A x64

      - name: Build engine
        run: cmake --build build --config Release --parallel

      - name: Test engine
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test desktop app
        run: dotnet test ui/ClipEngine.Desktop.Tests -c Release

      - name: Publish desktop app
        run: >
          dotnet publish ui/ClipEngine.Desktop -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:UpdateRepo=${{ vars.DOWNLOADS_REPO }}
          -p:OnlineServer=${{ vars.ONLINE_SERVER }} -o dist

      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item build/Release/clip_engine.exe dist/
          Copy-Item assets/detection.ini dist/
          Copy-Item assets/sounds dist/sounds -Recurse
          Copy-Item LICENSE dist/LICENSE.txt
          Get-ChildItem dist -Filter *.pdb | Remove-Item

      # The installer (installer/ClipEngine.iss) wraps the same files: a Start menu entry, an uninstaller and
      # clipengine:// links, for the current Windows account only. Inno Setup is on GitHub's Windows images; it's
      # installed with Chocolatey if not.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" /DSourceDir=..\dist installer\ClipEngine.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render screenshots
        run: dotnet run --project ui/ClipEngine.Desktop.Preview -c Release -- screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: Clip_Engine-${{ steps.version.outputs.version }}-windows-x64
          path: dist/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Clip_Engine-${{ steps.version.outputs.version }}-setup
          path: installer-out/Clip_Engine-Setup.exe
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
