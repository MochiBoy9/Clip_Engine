# Clip Engine detection rules.
#
# The engine reads parts of the screen a few times a second with Windows' built-in text
# recognition and looks for the words below. Nothing touches the game itself.
#
# To change a rule without touching the copy that ships with the app, copy this file to
# %LOCALAPPDATA%\Clip_Engine\detection.ini and edit that one; it wins when it exists.
# Set detection_debug = true in clip_engine.ini to log everything the engine reads, which
# shows what words each game really puts on screen.
#
# Sections are [<game>.<event>], or [<game>.<event>.<name>] for more than one rule per
# event. Games: the_finals, overwatch, battlefield_6, valorant, fortnite, apex_legends, pubg,
# marvel_rivals, rainbow_six_siege, call_of_duty, arc_raiders, delta_force.
# Events: kill, assist, death, revive, match_start, match_end, highlight.
#
# Counter-Strike 2, Dota 2, League of Legends and Rocket League aren't in this file: Clip Engine
# reads their own game APIs instead, which is exact.
#
#   region      = left, top, width, height as fractions of the screen (0.5 = middle)
#   words       = words or phrases separated by |, any of which means the event happened.
#                 {player} stands for your in-game names (player_names in clip_engine.ini,
#                 or Games > Your in-game name in the app). {number} stands for any number
#                 on the same row, as in ELIMINATION {number} for a "+250" score line
#   exclude     = words that cancel a match when they're right next to it or on the same row,
#                 like BY in "ELIMINATED BY" (a death, not a kill)
#   position    = anywhere (default), start or end: the words must begin or finish a row of
#                 text. In a killfeed the killer is at the start of a row and the player who
#                 died at the end, so {player} at the start is your kill and at the end your death
#   cooldown_ms = repeats closer together than this are ignored (default 1000). Kills, assists
#                 and revives found during it aren't lost: they're counted once it's over
#   threshold   = 1-255 keeps only pixels at least this bright, which helps on busy
#                 backgrounds; 0 (default) reads the region as it is
#   sample_ms   = how often to look, 100-5000. By default kills and other quick popups use
#                 sample_ms from [detection], deaths every 500 ms and match banners every second
#
# A message counts once however long it stays up: it's remembered by the names in it, so
# the same killfeed line read again isn't another kill, but a new name is. Numbers don't
# count as names, since scores and countdowns change while the same message is up. A phrase
# with {number} in it is a score line, which names no one, so it's told apart only by going
# away: two at once are two kills. Words never match their plural (REVIVES, ELIMINATIONS),
# which are scoreboard headings.
#
# Nothing is read while another window is in front of the game, such as this app.
#
# For a HUD that shows a kill as a picture (a skull, a banner, a hit marker), cut the icon out
# of a screenshot (clip_engine.exe --frame saves one from a clip) and look for it instead:
#   image        = the picture, a PNG next to this file or a full path. Make the background
#                  transparent so only the icon itself is compared
#   image_match  = how alike, 0-1, the screen must be to it (default 0.85)
#   image_screen = the height of the screen it was cut from, like 1440, so it's found at any
#                  resolution; leave it out when you play at that resolution
# The region should be a little bigger than where the icon shows. A rule looks for either an
# image or words, so give each its own section, like [valorant.kill.banner] below.
#
# [<game>.scoreboard] says how to read the game's scoreboard (the one held on Tab, or the
# end-of-match summary) for your totals in the match, which go into your records. Each stat is
# found under its column header on the row with your name, so the order of the columns and any
# others the game has don't matter. Needs your in-game name, like the killfeed rules.
#
#   region    = where the board is drawn (default: the middle of the screen, 0.05, 0.05, 0.9, 0.9)
#   sample_ms = how often it's read (default 1000); it's big, so less often than a killfeed
#   <stat>    = the column headers it shows under, like kills = K | KILLS | ELIMS. Common
#               stats: kills, deaths, assists, revives, score
#
# Any other game can be added with a [game.<id>] section naming it and the program it runs
# as, then rules for it like those below. Detection Studio in the app writes these for you.
#
#   [game.marvel_rivals]
#   name = Marvel Rivals
#   exe  = Marvel-Win64-Shipping.exe     (several separated by |)
#
#   [valorant.kill.banner]
#   region       = 0.42, 0.72, 0.16, 0.16
#   image        = valorant_kill_banner.png
#   image_match  = 0.85
#   image_screen = 1440
#
# The words and regions below are a first pass from how these HUDs usually look. They
# need checking against real gameplay, so expect to tune them.

[detection]
sample_ms = 250


# ---------------------------------------------------------------------- The Finals

# Every kill, assist and revive of yours puts a headline in the middle of the screen
# ("ELIMINATED <name>", "REVIVE <name>") and a score line under it ("ELIMINATION +250",
# "ASSIST +100", "REVIVE +200"). Only the score line is counted: the headline would count
# each one twice, its name reads differently from one look to the next, and a downed
# teammate's marker and the hold-E prompt say REVIVE too, but never with points.
[the_finals.kill]
region = 0.30, 0.52, 0.40, 0.24
words = ELIMINATION {number}
exclude = DOUBLE | TRIPLE | TEAM WIPE

[the_finals.assist]
region = 0.30, 0.52, 0.40, 0.24
words = ASSIST {number}

[the_finals.revive]
region = 0.30, 0.52, 0.40, 0.24
words = REVIVE {number}

[the_finals.death]
region = 0.20, 0.30, 0.60, 0.50
words = ELIMINATED BY | YOU WERE ELIMINATED | RESPAWNING IN | RESPAWN IN
cooldown_ms = 8000

[the_finals.highlight]
region = 0.30, 0.52, 0.40, 0.24
words = TEAM WIPE | TEAM WIPED | DOUBLE ELIMINATION | TRIPLE ELIMINATION | CASHOUT STOLEN
cooldown_ms = 3000

[the_finals.match_start]
region = 0.20, 0.15, 0.60, 0.35
words = ROUND STARTED | MATCH STARTED | ROUND 1
cooldown_ms = 60000

[the_finals.match_end]
region = 0.15, 0.15, 0.70, 0.45
words = VICTORY | DEFEAT | YOUR TEAM WON | ELIMINATED FROM THE TOURNAMENT
cooldown_ms = 60000


