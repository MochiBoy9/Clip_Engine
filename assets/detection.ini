# Clip Engine detection rules.
#
# The engine reads parts of the screen a few times a second with Windows' built-in text
# recognition and looks for the words below. Nothing touches the game itself.
#
# To change a game's rules, use Detection Studio in the app, or put the game's sections in
# %LOCALAPPDATA%\Clip_Engine\detection.ini. A game with rules there uses those instead of the
# ones below; every other game keeps these, so fixes to them still arrive with updates.
# Set detection_debug = true in clip_engine.ini to log everything the engine reads, which
# shows what words each game really puts on screen.
#
# Sections are [<game>.<event>], or [<game>.<event>.<name>] for more than one rule per
# event. Games: the_finals, overwatch, battlefield_6, battlefield_2042, battlefield_v,
# battlefield_1, battlefield_4, valorant, fortnite, apex_legends, pubg, marvel_rivals,
# rainbow_six_siege, call_of_duty, delta_force, deadlock, halo_infinite, halo_mcc, paladins,
# splitgate, team_fortress_2, arc_raiders, escape_from_tarkov, helldivers_2,
# deep_rock_galactic, roblox, minecraft.
# Events: kill, assist, death, revive, match_start, match_end, highlight.
#
# Counter-Strike 2, Dota 2, League of Legends and Rocket League aren't in this file: Clip Engine
# reads their own game APIs instead, which is exact. Team Fortress 2's kills and deaths come
# from its console log the same way; its killfeed rules below are used only until the log
# starts arriving.
#
#   region      = left, top, width, height as fractions of the screen (0.5 = middle)
#   words       = words or phrases separated by |, any of which means the event happened.
#                 {player} stands for your in-game names (player_names in clip_engine.ini,
#                 or Games > Your in-game name in the app). {number} stands for any number
#                 on the same row, as in ELIMINATION {number} for a "+250" score line
#   exclude     = words that cancel a match when they're right next to it or on the same row,
#                 like BY in "ELIMINATED BY" (a death, not a kill)
#   position    = anywhere (default), start or end: the words must begin or finish a row of
#                 text. In a killfeed the killer is at the start of a row and the player who
#                 died at the end, so {player} at the start is your kill and at the end your death
#   cooldown_ms = repeats closer together than this are ignored (default 1000). Kills, assists
#                 and revives found during it aren't lost: they're counted once it's over
#   threshold   = 1-255 keeps only pixels at least this bright, which helps on busy
#                 backgrounds; 0 (default) reads the region as it is
#   anchor      = what the box keeps to when the screen isn't 16:9 or the HUD isn't at 100%:
#                 left, right, top, bottom, center, or two of them like top-right. By default
#                 it's the edge it's nearest (a box in the middle third keeps to the middle), as
#                 most HUDs do on an ultrawide or 16:10 screen. Set the HUD size per game in
#                 Detection Studio (hud_scale in clip_engine.ini)
#   aspect      = the shape of the screen the box was drawn on, like 21:9 (default 16:9).
#                 Detection Studio sets it when you draw on a frame from another screen shape
#   forget_ms   = how long a message must be gone before it counts again. By default 3 seconds
#                 for one with a name in it and about a second for one without, like a score
#                 line; raise it for a popup that fades and is easily lost for a read or two
#   merge_ms    = for a moment the HUD shows in more than one place: matches of the same event
#                 from rules with merge_ms, each within this long of the one before, are the
#                 same moment or moments, and count once (see [the_finals.kill.killfeed])
#   priority    = which of those rules says how many there were (default 1; highest wins).
#                 A rule that alone saw a moment still counts it, so a misread isn't a miss
#   skip_tag    = true: with position = start, a squad or club tag may come before the name
#   sound       = listen to the game's audio for a sound instead of reading the screen: WAV
#                 files cut from a clip, each starting 0.3 s before the sound and running a
#                 second or so; several are averaged. No region needed
#   sound_match = how alike, 0-1, the audio must be to them (default 0.44)
#   confirm_only = true: the rule never counts a moment alone, only backs up a rule with
#                 merge_ms, as the sound in [the_finals.kill.sound] does
#   sample_ms   = how often to look, 100-5000. By default kills and other quick popups use
#                 sample_ms from [detection], deaths every 500 ms and match banners every second
#
# A message counts once however long it stays up: it's remembered by the names in it, so
# the same killfeed line read again isn't another kill, but a new name is. Numbers don't
# count as names, since scores and countdowns change while the same message is up. A phrase
# with {number} in it is a score line, which names no one, so it's told apart only by going
# away: two at once are two kills. Words never match their plural (REVIVES, ELIMINATIONS),
# which are scoreboard headings.
#
# Nothing is read while another window is in front of the game, such as this app.
#
# For a HUD that shows a kill as a picture (a skull, a banner, a hit marker), cut the icon out
# of a screenshot (clip_engine.exe --frame saves one from a clip) and look for it instead:
#   image        = the picture, a PNG next to this file or a full path. Make the background
#                  transparent so only the icon itself is compared
#   image_match  = how alike, 0-1, the screen must be to it (default 0.85)
#   image_screen = the height of the screen it was cut from, like 1440, so it's found at any
#                  resolution; leave it out when you play at that resolution
# The region should be a little bigger than where the icon shows. A rule looks for either an
# image or words, so give each its own section, like [valorant.kill.banner] below.
#
# [<game>.scoreboard] says how to read the game's scoreboard (the one held on Tab, or the
# end-of-match summary) for your totals in the match, which go into your records. Each stat is
# found under its column header on the row with your name, so the order of the columns and any
# others the game has don't matter. Needs your in-game name, like the killfeed rules.
#
#   region    = where the board is drawn (default: the middle of the screen, 0.05, 0.05, 0.9, 0.9)
#   sample_ms = how often it's read (default 1000); it's big, so less often than a killfeed
#   <stat>    = the column headers it shows under, like kills = K | KILLS | ELIMS. Common
#               stats: kills, deaths, assists, revives, score
#
# [<game>.journal.<note>] is a journal rule, for games built around runs (raids, missions,
# expeditions). It writes down what the game shows, a note at a time, and the app's Journal
# page tells each run's story from the notes: the map picked, whether you went in, the
# enemies you destroyed, what you picked up and carried, and how it ended. Notes are map,
# condition, mission, queue, deploy, extracted, died, failed, left, downed, enemy,
# player_kill, loot, lost, inventory, xp and objective; any other name is kept as it is.
# [<game>.journal.<note>.<name>] gives a note more than one rule.
#
#   region      = where to read, as for the rules above (anchor, aspect and threshold too)
#   words       = any of these means the note, as in [arc_raiders.journal.extracted]
#   values      = which of these shows is the value, like a map's name. Words in brackets
#                 after a name are what to look for instead: The Blue Gate (BLUE GATE)
#   pick        = true (default): the screen shows the value picked, so a read showing several
#                 of them (a list of every map) notes none. false notes each one
#   pattern     = lines that carry the value: DESTROYED {value} {xp} XP. {value} is the words
#                 there, {number} how many and {xp} the XP the line gave
#   lines       = true: every line of text is a value, for a list like an inventory
#   exclude     = a line with any of these is skipped
#   when        = only while one of these words shows: in when_region if it's given, or in
#                 the region itself. With when_region, the region isn't read at all until its
#                 words show there, so a big list costs nothing while its menu is closed
#   when_region = the small box to look for the when words in, like a menu's title
#   sample_ms   = how often to read (default 500 for a pattern, 1500 otherwise)
#   cooldown_ms = notes closer together than this are skipped (default 0)
#   forget_ms   = how long a line must be gone before it's noted again (default 4 seconds for
#                 a pattern, 30 for the rest)
#
# clip_engine.exe --scan <clip> --game <id> runs a game's journal rules over a clip too, and
# prints each note it finds, which is the way to tune them.
#
# Any other game can be added with a [game.<id>] section naming it and the program it runs
# as, then rules for it like those below. Detection Studio in the app writes these for you.
#
#   [game.marvel_rivals]
#   name = Marvel Rivals
#   exe  = Marvel-Win64-Shipping.exe     (several separated by |)
#
#   [valorant.kill.banner]
#   region       = 0.42, 0.72, 0.16, 0.16
#   image        = valorant_kill_banner.png
#   image_match  = 0.85
#   image_screen = 1440
#
# The words and regions below are a first pass from how these HUDs usually look. They
# need checking against real gameplay, so expect to tune them.

[detection]
sample_ms = 250


# ---------------------------------------------------------------------- The Finals

# Every kill of yours shows twice: in the killfeed in the top right ("[SMEDC] YOU > [KEAYS]
# ENEMY", with a squad tag before each name), and under the crosshair as a headline
# ("ELIMINATED <name>") with a score line under it ("ELIMINATION +250"). The killfeed names
# who died, so it counts each kill once however long it stays up, and it's the one that
# counts; the score line backs it up, and counts a kill alone only when the killfeed was
# misread. The score line stays up for about four seconds and fades as it goes, so read on
# its own it used to count one kill two or three times. Assists and revives show only as
# score lines ("ASSIST +100", "REVIVE +200"); a downed teammate's marker and the hold-E
# prompt say REVIVE too, but never with points.
[the_finals.kill.killfeed]
region = 0.70, 0.03, 0.30, 0.20
words = {player}
position = start
skip_tag = true
cooldown_ms = 0
merge_ms = 4000
priority = 2

[the_finals.kill.score_line]
region = 0.30, 0.52, 0.40, 0.24
words = ELIMINATION {number}
exclude = DOUBLE | TRIPLE | TEAM WIPE
forget_ms = 3000
merge_ms = 4000

# Each elimination of yours also plays a chime. It's listened for to back up the two above,
# and shown with each kill as heard, but never counts a kill alone: gunfire and explosions
# can sound close enough to it. Cut from recorded matches, each 0.3 s before the chime.
[the_finals.kill.sound]
sound = sounds/the_finals_elimination_1.wav | sounds/the_finals_elimination_2.wav | sounds/the_finals_elimination_3.wav
sound_match = 0.44
confirm_only = true
merge_ms = 4000

[the_finals.assist]
region = 0.30, 0.52, 0.40, 0.24
words = ASSIST {number}
forget_ms = 3000

[the_finals.revive]
region = 0.30, 0.52, 0.40, 0.24
words = REVIVE {number}
forget_ms = 3000

[the_finals.death.killfeed]
region = 0.70, 0.03, 0.30, 0.20
words = {player}
position = end
cooldown_ms = 5000
merge_ms = 8000
priority = 2

[the_finals.death.death_screen]
region = 0.20, 0.30, 0.60, 0.50
words = ELIMINATED BY | YOU WERE ELIMINATED | RESPAWNING IN | RESPAWN IN
cooldown_ms = 8000
merge_ms = 8000

[the_finals.highlight]
region = 0.30, 0.52, 0.40, 0.24
words = TEAM WIPE | TEAM WIPED | DOUBLE ELIMINATION | TRIPLE ELIMINATION | CASHOUT STOLEN
cooldown_ms = 3000

[the_finals.match_start]
region = 0.20, 0.15, 0.60, 0.35
words = ROUND STARTED | MATCH STARTED | ROUND 1
cooldown_ms = 60000

[the_finals.match_end]
region = 0.15, 0.15, 0.70, 0.45
words = VICTORY | DEFEAT | YOUR TEAM WON | ELIMINATED FROM THE TOURNAMENT
cooldown_ms = 60000


