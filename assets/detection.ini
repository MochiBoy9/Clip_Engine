# ---------------------------------------------------------------------- Games with a journal
# ARC Raiders, Escape from Tarkov, Helldivers 2 and Deep Rock Galactic are built around runs:
# pick a map, go in, fight the AI (and maybe other players), loot, and get out or die. They
# keep most kills off the screen, so they aren't clipped on every kill, but each run goes into
# the journal (the journal rules at the end of this file), and how it ended is a moment: a
# death and a match end, with a clip around each. Hunt: Showdown 1896 isn't here: its journal
# comes from the match summary the game writes to a file.

