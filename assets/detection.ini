# Clip Engine detection rules.
#
# The engine reads parts of the screen a few times a second with Windows' built-in text
# recognition and looks for the words below. Nothing touches the game itself.
#
# To change a rule without touching the copy that ships with the app, copy this file to
# %LOCALAPPDATA%\Clip_Engine\detection.ini and edit that one; it wins when it exists.
# Set detection_debug = true in clip_engine.ini to log everything the engine reads, which
# shows what words each game really puts on screen.
#
# Sections are [<game>.<event>], or [<game>.<event>.<name>] for more than one rule per
# event. Games: the_finals, overwatch, battlefield_6.
# Events: kill, assist, death, revive, match_start, match_end, highlight.
#
#   region      = left, top, width, height as fractions of the screen (0.5 = middle)
#   words       = words or phrases separated by |, any of which means the event happened
#   exclude     = words that cancel the rule while they're on screen
#   cooldown_ms = repeats closer together than this are ignored (default 1000)
#   threshold   = 1-255 keeps only pixels at least this bright, which helps on busy
#                 backgrounds; 0 (default) reads the region as it is
#
# The words and regions below are a first pass from how these HUDs usually look. They
# need checking against real gameplay, so expect to tune them.

[detection]
sample_ms = 250


# ---------------------------------------------------------------------- The Finals

[the_finals.kill]
region = 0.30, 0.52, 0.40, 0.24
words = ELIMINATED | ELIMINATION | KNOCKED OUT
exclude = BY | YOU WERE

[the_finals.assist]
region = 0.30, 0.52, 0.40, 0.24
words = ASSIST

[the_finals.revive]
region = 0.30, 0.52, 0.40, 0.24
words = REVIVED | REVIVE COMPLETE | RESURRECTED

[the_finals.death]
region = 0.20, 0.30, 0.60, 0.50
words = ELIMINATED BY | YOU WERE ELIMINATED | RESPAWNING IN | RESPAWN IN
cooldown_ms = 8000

[the_finals.highlight]
region = 0.30, 0.52, 0.40, 0.24
words = TEAM WIPE | TEAM WIPED | DOUBLE ELIMINATION | TRIPLE ELIMINATION | CASHOUT STOLEN
cooldown_ms = 3000

[the_finals.match_start]
region = 0.20, 0.15, 0.60, 0.35
words = ROUND STARTED | MATCH STARTED | ROUND 1
cooldown_ms = 60000

[the_finals.match_end]
region = 0.15, 0.15, 0.70, 0.45
words = VICTORY | DEFEAT | YOUR TEAM WON | ELIMINATED FROM THE TOURNAMENT
cooldown_ms = 60000


# ---------------------------------------------------------------------- Overwatch

[overwatch.kill]
region = 0.30, 0.55, 0.40, 0.20
words = ELIMINATED
exclude = BY | YOU WERE

[overwatch.assist]
region = 0.30, 0.55, 0.40, 0.20
words = ASSIST

[overwatch.revive]
region = 0.30, 0.55, 0.40, 0.20
words = RESURRECTED | REVIVED

[overwatch.death]
region = 0.20, 0.10, 0.60, 0.80
words = ELIMINATED BY | YOU WERE ELIMINATED | KILLCAM
cooldown_ms = 8000

[overwatch.highlight]
region = 0.20, 0.15, 0.60, 0.60
words = PLAY OF THE GAME | TEAM KILL | ON FIRE
cooldown_ms = 5000

[overwatch.match_start]
region = 0.20, 0.10, 0.60, 0.40
words = ASSEMBLE YOUR TEAM | ROUND 1
cooldown_ms = 60000

[overwatch.match_end]
region = 0.15, 0.20, 0.70, 0.40
words = VICTORY | DEFEAT | DRAW
cooldown_ms = 60000


# ---------------------------------------------------------------------- Battlefield 6

[battlefield_6.kill]
region = 0.32, 0.58, 0.36, 0.22
words = KILL | ENEMY KILLED | HEADSHOT KILL
exclude = KILLED BY | ASSIST

[battlefield_6.assist]
region = 0.32, 0.58, 0.36, 0.22
words = ASSIST | KILL ASSIST

[battlefield_6.revive]
region = 0.32, 0.58, 0.36, 0.22
words = REVIVE | REVIVED | SQUAD REVIVE

[battlefield_6.death]
region = 0.20, 0.10, 0.60, 0.80
words = KILLED BY | YOU WERE KILLED | REDEPLOY
cooldown_ms = 8000

[battlefield_6.highlight]
region = 0.32, 0.58, 0.36, 0.22
words = SQUAD WIPE | MULTI KILL | DOUBLE KILL | TRIPLE KILL | LONG SHOT
cooldown_ms = 3000

[battlefield_6.match_start]
region = 0.20, 0.10, 0.60, 0.40
words = MATCH STARTING | ROUND STARTING
cooldown_ms = 60000

[battlefield_6.match_end]
region = 0.15, 0.15, 0.70, 0.45
words = VICTORY | DEFEAT | ROUND WON | ROUND LOST
cooldown_ms = 60000
