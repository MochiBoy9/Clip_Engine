# ---------------------------------------------------------------------- Battlefield 6

# Each kill of yours shows twice: as a KILL line in the score feed under the crosshair, and in
# the killfeed in the top right ("[TAG]YOU [weapon] ENEMY"). They're one moment: the killfeed
# names who died, so it says how many, and the score feed counts a kill alone when the
# killfeed was misread or hidden.
[battlefield_6.kill]
region = 0.32, 0.58, 0.36, 0.22
words = KILL | ENEMY KILLED | HEADSHOT KILL
exclude = KILLED BY | ASSIST | DOUBLE KILL | TRIPLE KILL | MULTI KILL
