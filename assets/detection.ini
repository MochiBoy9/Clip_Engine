# ---------------------------------------------------------------------- Journals
# What each run's story is made of, in games built around runs. Like the rules above, these
# are a first pass from how these games' menus and HUDs are described, and need checking
# against real play: run clip_engine.exe --scan on a clip of a whole run to see what they note.
# Menus and banners are read every second and a half at most, and only when they change;
# inventories only while their title is up, so a journal costs about as much as one more
# killfeed rule while you play.

# ---------------------------------- ARC Raiders
# Before the raid: the map picked (the map screen shows every map, so a read of the whole list
# notes none; the one picked shows alone as you queue and load in), and the queue starting.
# In the raid: the XP log names each ARC you destroy ("DESTROYED WASP +100 XP"), raiders you
# down, and what you pick up. After it: how it ended, and the XP summary (Scavenged, Damaged
# ARC, Destroyed ARC, Time on Surface, and the Safe Return Bonus you only get by extracting).

[arc_raiders.journal.map]
region = 0.00, 0.00, 1.00, 0.40
values = Dam Battlegrounds (DAM BATTLEGROUNDS, BATTLEGROUNDS) | Buried City | Spaceport | The Blue Gate (BLUE GATE) | Stella Montis | Riven Tides
sample_ms = 2000

[arc_raiders.journal.condition]
region = 0.00, 0.00, 1.00, 0.40
values = Night Raid | Electromagnetic Storm (ELECTROMAGNETIC STORM, EM STORM) | Locked Gate | Harvester | Hidden Bunker | Husk Graveyard | Prospecting Probes | Cold Snap
pick = false
sample_ms = 2000

[arc_raiders.journal.queue]
region = 0.20, 0.30, 0.60, 0.50
words = SEARCHING FOR RAID | SEARCHING FOR MATCH | MATCHMAKING | FINDING RAIDERS | FINDING SQUAD
cooldown_ms = 60000

[arc_raiders.journal.deploy]
region = 0.20, 0.30, 0.60, 0.50
words = DEPLOYING | DESCENDING TOPSIDE | HEADING TOPSIDE | ENTERING TOPSIDE | RAID STARTING
cooldown_ms = 120000

[arc_raiders.journal.enemy]
region = 0.58, 0.30, 0.40, 0.40
pattern = DESTROYED {value} {xp} XP | DESTROYED {value} | {value} DESTROYED {xp} XP | {value} DESTROYED
exclude = DAMAGED | RAIDER | CONTAINER

[arc_raiders.journal.player_kill]
region = 0.58, 0.30, 0.40, 0.40
words = RAIDER DOWNED | DOWNED A RAIDER | DOWNED RAIDER | RAIDER ELIMINATED | ELIMINATED A RAIDER | KNOCKED OUT A RAIDER
exclude = YOU WERE | BY

[arc_raiders.journal.loot]
region = 0.70, 0.55, 0.29, 0.32
pattern = PICKED UP {value} | LOOTED {value} | {value} ADDED
exclude = XP | PRESS | HOLD | SEARCH

[arc_raiders.journal.downed]
region = 0.15, 0.10, 0.70, 0.50
words = YOU ARE DOWNED | YOU WERE DOWNED | DOWNED BY | KNOCKED OUT BY
cooldown_ms = 15000

[arc_raiders.journal.died]
region = 0.15, 0.10, 0.70, 0.50
words = YOU DIED | YOU WERE KILLED | ELIMINATED BY | KILLED BY | BLED OUT | RAID FAILED
cooldown_ms = 120000

[arc_raiders.journal.extracted]
region = 0.15, 0.10, 0.70, 0.50
words = EXTRACTED | EXTRACTION COMPLETE | EXTRACTION SUCCESSFUL | SAFE RETURN
exclude = FAILED
cooldown_ms = 120000

[arc_raiders.journal.xp]
region = 0.05, 0.12, 0.90, 0.80
pattern = SCAVENGED {number} | DAMAGED ARC {number} | DESTROYED ARC {number} | TIME ON SURFACE {number} | SAFE RETURN BONUS {number} | TOTAL XP {number}
when = SUMMARY | RESULTS | RAID COMPLETE | RAID OVER | XP EARNED | EXTRACTED | YOU DIED
when_region = 0.20, 0.00, 0.60, 0.14
sample_ms = 1500
forget_ms = 120000

# The backpack and loadout, whenever they're open: in the raid, what you're carrying, and
# before it, what you're taking in. Item names show where the game prints them; numbers on
# the same line are stack sizes.
[arc_raiders.journal.inventory]
region = 0.04, 0.12, 0.92, 0.80
lines = true
when = INVENTORY | BACKPACK | LOADOUT | SAFE POCKET
when_region = 0.00, 0.00, 1.00, 0.12
exclude = INVENTORY | BACKPACK | LOADOUT | STASH | SAFE POCKET | QUICK USE | AUGMENT | SHIELD | WEIGHT | SORT | EQUIP | UNEQUIP | DROP | INSPECT | SELL | RECYCLE | CANCEL | BACK | CLOSE
sample_ms = 2000

